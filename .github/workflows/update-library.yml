name: update-library

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 05:17 KST (UTC 20:17)
  workflow_dispatch: {}     # Actions 탭에서 바로 실행하는 버튼

permissions:
  contents: write

concurrency:
  group: update-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 노션에서 기록을 읽어 도서관 페이지 다시 만들기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/build_library.py
      - name: 바뀐 내용이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html library/index.html
          # 날짜만 바뀐 경우는 커밋하지 않는다
          if git diff --cached -U0 | grep -E '^[+-][^+-]' | grep -vqE '기록 기준|기준입니다|SNAP_NOW|<!--n:date-->'; then
            git commit -m "도서관 기록 갱신 ($(TZ=Asia/Seoul date +%Y.%m.%d))"
            git push
          else
            echo "기록에 바뀐 것이 없어 커밋하지 않습니다."
          fi
