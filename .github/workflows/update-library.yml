name: update-library

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 05:17 KST (UTC 20:17)
  workflow_dispatch: {}     # Actions 탭에서 바로 실행하는 버튼

permissions:
  contents: write

concurrency:
  group: update-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 노션에서 기록을 읽어 도서관 페이지 다시 만들기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/build_library.py
      - name: 커밋 (기록이 그대로여도 확인 날짜는 매일 올린다)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html library/index.html
          if git diff --cached --quiet; then
            echo "바뀐 것이 없습니다."
          elif git diff --cached -U0 | grep -E '^[+-][^+-]' | grep -vqE '기록 기준|기준입니다|SNAP_NOW|<!--n:date-->'; then
            git commit -m "도서관 기록 갱신 ($(TZ=Asia/Seoul date +%Y.%m.%d))"
            git push
          else
            git commit -m "도서관 확인 날짜 갱신 ($(TZ=Asia/Seoul date +%Y.%m.%d))"
            git push
          fi
